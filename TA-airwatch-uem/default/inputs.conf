# Defaults for every airwatch_gps input. Inputs themselves are created in Splunk
# Web (app > Inputs, or Settings > Data inputs > AirWatch device GPS) and saved
# in this app's local/inputs.conf.
[airwatch_gps]
python.version = python3
python.required = 3.13,3.9
interval = 3600
index_in_splunk = 1
write_cef = 0
cef_max_mb = 1024
first_lookback_min = 60
overlap_min = 60
max_lookback_hours = 24
geocode = 1
log_level = INFO
