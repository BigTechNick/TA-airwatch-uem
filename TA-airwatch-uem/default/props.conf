# ---------------------------------------------------------------- events
# One JSON object per device GPS sample, sent by the airwatch_gps modular input
# with _time = SampleTime (UTC). The timestamp settings give the same time if
# Splunk reads it from the event instead.
[airwatch:gps]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = "SampleTime":"
TIME_FORMAT = %m/%d/%Y %I:%M:%S %p
MAX_TIMESTAMP_LOOKAHEAD = 25
TZ = UTC
KV_MODE = json
# CIM: the device's user and the device
FIELDALIAS-airwatch_gps_user = UserName AS user
FIELDALIAS-airwatch_gps_dest = DeviceFriendlyName AS dest
EVAL-vendor = "AirWatch"
EVAL-product = "Workspace ONE UEM"
EVAL-vendor_product = "AirWatch Workspace ONE UEM"
# The device's position under the names geostats uses by default
# (latitude/longitude are the nearest city's).
EVAL-lat = Latitude
EVAL-lon = Longitude

# ---------------------------------------------------------------- collector logs
# $SPLUNK_HOME/var/log/splunk/airwatch_gps_<input>.log -> index _internal
[source::.../var/log/splunk/airwatch_gps_*.log*]
priority = 10
sourcetype = airwatch:gps:log

# $SPLUNK_HOME/var/log/splunk/airwatch_gps-webapi.log (Inputs page actions)
[source::.../var/log/splunk/airwatch_gps-webapi.log*]
priority = 10
sourcetype = airwatch:gps:webapi

[airwatch:gps:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
TRUNCATE = 20000
EXTRACT-airwatch_gps_input = airwatch_gps_(?<input>[^\\/]+?)\.log(?:\.\d+)?$ in source
EXTRACT-airwatch_gps_line = ^\S+ \S+ (?<log_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) (?<message>.*)
EXTRACT-airwatch_gps_run = run done: devices (?<devices>\d+) \((?<pages>\d+) pages\), samples (?<samples>\d+), new (?<new>\d+), repeated (?<repeated>\d+), without device (?<without_device>\d+), without location (?<without_location>\d+), splunk (?<splunk>\d+), cef (?<cef>\d+).*?, window (?<window_start>\S+)\.\.(?<window_end>\S+), took (?<took_sec>[\d.]+) s
EXTRACT-airwatch_gps_failed = run failed: (?<run_error>.+)

[airwatch:gps:webapi]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
EXTRACT-airwatch_gps_webapi = ^\S+ \S+ (?<log_level>[A-Z]+) (?<message>.*)
