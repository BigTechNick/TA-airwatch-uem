# REST API used by the app's Inputs page (bin/airwatch_gps_rest.py). Admins only: it
# reads input settings, and its Test and Save actions make this server call a URL.
[script:airwatch_gps_inputs]
match = /airwatch_gps/inputs
script = airwatch_gps_rest.py
scripttype = persist
handler = airwatch_gps_rest.Handler
requireAuthentication = true
capability = admin_all_objects
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9

[script:airwatch_gps_clients]
match = /airwatch_gps/clients
script = airwatch_gps_rest.py
scripttype = persist
handler = airwatch_gps_rest.Handler
requireAuthentication = true
capability = admin_all_objects
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9
