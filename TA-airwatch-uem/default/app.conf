# TA-airwatch-uem
[install]
build = 2

[launcher]
author = Nikhil Chawla
description = Collects device GPS locations from Workspace ONE UEM (AirWatch) with each device's user and the nearest city, for Splunk (sourcetype airwatch:gps) and/or as CEF files. OAuth clients, inputs and status are managed in Splunk Web. Not affiliated with the product's vendor.
version = 1.0.1

[ui]
is_visible = true
label = Nikhil Chawla Add-on for AirWatch (Workspace ONE UEM)
supported_themes = light,dark

[package]
id = TA-airwatch-uem
check_for_updates = true

[id]
name = TA-airwatch-uem
version = 1.0.1
